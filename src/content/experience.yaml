  company: CivicDataLab
  url: https://civicdatalab.in/
  place: New Delhi (hybrid)
  type: Full-time
  start: 2026-02-01
  about: A research lab working with data, technology, design and social science to strengthen civic engagement in India.
  points:
    - Built ParakhAI, an open-source, participatory tool for checking AI models for fairness, safety and bias, supported by MeitY’s IndiaAI Mission under the Safe and Trusted AI pillar.
