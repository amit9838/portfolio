# stars/forks/downloads are fallbacks; the build refreshes them from GitHub (`repo`) and Flathub (`flathub`).
mousam:
  name: Mousam
  icon: ../assets/projects/mousam.svg
  tier: flagship
  order: 1
  desc: A native Linux weather app with AQI, hourly and 7-day graphs, a compact mode and 21 languages.
  stack: [Python, GTK4, Libadwaita]
  repo: amit9838/mousam
  stars: 499
  forks: 72
  flathub: io.github.amit9838.mousam
  downloads: 129075
  distros: 10
  quote:
    text: Mousam is more than a match for meteorological software made by the likes of Apple, Microsoft and Google.
    source: OMG! Ubuntu
    url: https://www.omgubuntu.co.uk/2024/10/mousam-modern-weather-app-for-linux
  featuredBy:
    - { name: DistroTube, url: 'https://www.youtube.com/watch?v=-IQ75MwPS0M', brand: youtube }
    - name: OMG! Ubuntu
      url: https://www.omgubuntu.co.uk/2024/10/mousam-modern-weather-app-for-linux
      brand: omgubuntu
    - name: LinuxLinks
      url: https://www.linuxlinks.com/mousam-weather-python/
      brand: linuxlinks
  evidence:
    text: Google’s AI Overview names Mousam the “best overall desktop” weather app on Linux.
    button: See screenshot
    image: ../assets/mousam-google-ai-overview.png
    alt: 'Google search for “best weather app on linux”. The AI Overview says Mousam is widely considered one of the best modern weather apps on Linux and lists it first as “Best overall desktop app”, ahead of GNOME Weather and Meteo.'
    caption: Google search for “best weather app on linux”, November 2026. AI-generated results can vary by person and over time.
  links:
    - { label: GitHub, url: 'https://github.com/amit9838/mousam' }
    - { label: Flathub, url: 'https://flathub.org/apps/io.github.amit9838.mousam' }
    - { label: Snap Store, url: 'https://snapcraft.io/mousam' }
    - { label: Website, url: 'https://amit9838.github.io/mousam/' }
